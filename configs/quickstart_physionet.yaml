# Compact demonstration configuration.
# This is not the full population-level benchmark protocol.
# Run one subject with scripts/run_benchmark.py --subjects 1.
project_name: motor_imagery_eeg_robustness_quickstart
moabb_data_dir: moabb_data
results_dir: results/quickstart
random_seed: 42
preprocessing:
  fmin_hz: 8
  fmax_hz: 32
  resample_hz: 128
datasets:
- name: PhysionetMI
  paradigm: LeftRightImagery
  note: PhysioNet EEG Motor Movement/Imagery, 109 volunteers; open access through
    PhysioNet/MOABB.
pipelines:
- name: csp_lda
  description: Classical Common Spatial Patterns + Linear Discriminant Analysis baseline.
  csp_components: 6
stressors:
  channel_dropout:
    enabled: true
    dropout_fractions:
    - 0.1
    - 0.3
    - 0.5
    repeats_per_fraction: 2
    mask_seed_scope: participant
  reduced_montage:
    enabled: false
    montages:
    - name: motor_core
      channels:
      - C3
      - Cz
      - C4
    - name: motor_extended
      channels:
      - FC3
      - FCz
      - FC4
      - C3
      - Cz
      - C4
      - CP3
      - CPz
      - CP4
  cross_session:
    enabled: false
    evaluation: train_first_session_test_later_sessions_when_available
statistics:
  primary_metric: roc_auc
  secondary_metrics:
  - balanced_accuracy
  - calibration_error
  confidence_intervals: bootstrap_subject_level
  bootstrap_repeats: 2000
  primary_inference: participant_level_paired_comparisons
  secondary_model: mixed_effects_subject_random_intercept
  multiple_comparisons: benjamini_hochberg_fdr
  alpha: 0.05
analysis:
  clean_working_auc_threshold: 0.6
  failure_auc_threshold: 0.6
  primary_dropout_fraction: 0.3
  risk_levels:
    high: 0.5
    moderate: 0.2
